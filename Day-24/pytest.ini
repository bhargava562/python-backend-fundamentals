[pytest]
# Pytest configuration
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    -ra
markers =
    asyncio: async test functions
    integration: integration tests
    unit: unit tests
    slow: slow running tests

# Coverage options
[coverage:run]
branch = True
omit =
    */tests/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
